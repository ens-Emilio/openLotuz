name: Secrets Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  custom-block:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block real domains / placeholder bypass
        run: |
          set -euo pipefail
          echo "Checking for real secrets that gitleaks might miss..."
          # These patterns were the previous leak: any occurrence fails the build.
          # We deliberately do NOT list the values here — we block the *pattern* of real infra.
          FAIL=0

          # Block any non-example domain in tracked files (allow example.com only)
          if git grep -I -E 'truuz\.com\.br|Lotuz[A-Za-z0-9]+2026|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.cfargotunnel\.com' -- ':!*.png' ':!*.jpg' ':!SECURITY.md' 2>/dev/null | grep -v '^Binary' | grep -v 'SEU_\|example\.com'; then
            echo "❌ Blocked pattern found (real domain / tunnel URL / placeholder bypass)."
            FAIL=1
          fi

          # Block likely Cloudflare IDs if they appear as hex (not SEU_ placeholder)
          if git grep -I -E '6835eeba86060be88cfe0420de9764c9|0651daf3546c9171d9e5924f6783b449' -- 2>/dev/null; then
            echo "❌ Hardcoded Cloudflare ID found."
            FAIL=1
          fi

          if [[ $FAIL -eq 1 ]]; then
            echo "Fix: replace with example.com / SEU_ZONE_ID / SEU_ACCOUNT_ID / SEU_TUNNEL_ID"
            exit 1
          fi
          echo "✅ Custom block passed."
