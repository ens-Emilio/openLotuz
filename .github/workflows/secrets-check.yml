name: Secrets Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  custom-block:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate placeholders and tracked environment files
        run: |
          set -euo pipefail
          python3 scripts/check-env.py
          if git ls-files | grep -E '(^|/)(\.env|.*\.env\.[^e]|.*\.pem|.*\.key)$'; then
            echo "❌ Environment or private key file is tracked."
            exit 1
          fi
          echo "✅ Placeholder and tracked-file checks passed."
