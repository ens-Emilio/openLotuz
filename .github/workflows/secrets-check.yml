name: Secrets Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  custom-block:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block real domains / placeholder bypass
        run: |
          set -euo pipefail
          echo "Checking for real secrets that gitleaks might miss..."
          FAIL=0
          # Block the leaked domain in project files (the rule itself mentions the marker)
          if git grep -I -E 'truuz\.com\.br' -- ':!*.png' ':!*.jpg' ':!*.pdf' ':!SECURITY.md' ':!ROADMAP.md' ':!CONTRIBUTING.md' ':!.github/workflows/secrets-check.yml' 2>/dev/null; then
            echo "❌ Blocked pattern found (real domain truuz.com.br without placeholder)."
            FAIL=1
          fi
          # Block hardcoded demo passwords (only real ones, not docs about them)
          if git grep -I -E 'Lotuz[A-Za-z0-9]+2026' -- ':!*.png' ':!*.jpg' 2>/dev/null | grep -v 'check-env.py'; then
            echo "❌ Hardcoded demo password pattern found."
            FAIL=1
          fi
          # Block specific leaked Cloudflare IDs (allow this rule file and validator to document them)
          if git grep -I -E '6835eeba86060be88cfe0420de9764c9|0651daf3546c9171d9e5924f6783b449' -- ':!.github/workflows/secrets-check.yml' ':!scripts/check-env.py' ':!Makefile' 2>/dev/null; then
            echo "❌ Hardcoded Cloudflare ID found."
            FAIL=1
          fi
          if [[ $FAIL -eq 1 ]]; then
            echo "Fix: replace with example.com / SEU_ZONE_ID / SEU_ACCOUNT_ID / SEU_TUNNEL_ID"
            exit 1
          fi
          echo "✅ Custom block passed."
