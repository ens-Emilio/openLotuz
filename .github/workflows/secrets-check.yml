name: Secrets Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necessário para detectar secrets em todo o histórico (opcional, mas bom)

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect secrets (high entropy strings & known patterns)
        run: |
          # List of regex patterns for common secrets
          PATTERNS=(
            'AKIA[0-9A-Z]{16}'                                # AWS Access Key ID
            'wp-[0-9a-zA-Z]{32,}'                             # WordPress secret-like
            'ghp_[0-9a-zA-Z]{36}'                             # GitHub Personal Token (classic)
            'github_pat_[0-9a-zA-Z]{}_[0-9a-zA-Z]{36,}'       # GitHub Fine-grained Token
            'sk_live_[0-9a-zA-Z]{24,}'                        # Stripe Live Key
            'sk_test_[0-9a-zA-Z]{24,}'                        # Stripe Test Key
            'sq.*-[0-9a-zA-Z]{22,}'                           # Square Access Token
            'sg\.[0-9a-zA-Z]{22,}'                            # SendGrid API Key
            'SLBV[0-9a-zA-Z]{2,}-[0-9a-zA-Z]{2,}-[0-9a-zA-Z]{16,}' # Mailgun
            'xox[baprs]-[0-9]{11,}-[0-9]{11,}-[0-9]{11,}-[0-9a-zA-Z]{24,}' # Slack Token
            'xoxp-[0-9]{11,}-[0-9]{11,}-[0-9]{11,}-[0-9]*'
            'sg\.[0-9a-zA-Z]{22,}'                            # SendGrid
            'SSWS[0-9a-zA-Z]{2,}-[0-9a-zA-Z]{2,}-[0-9]{22,}'  # Okta Token
            'ya29\.[0-9a-zA-Z\-_]+'                           # Google OAuth
            'AIza[0-9A-Za-z\-_]{35}'                          # Google API Key
            'yahoo[!_]'                                       # apenas para demo - remover se gerar falso positivo
          )

          # Combine into a single grep -E pattern
          PATTERN_STRING=$(IFS=\|; echo "${PATTERNS[*]}")

          echo "Scanning for secrets..."
          if git grep -I -E "$PATTERN_STRING" -- ':!*.png' ':!*.jpg' ':!*.jpeg' ':!*.gif' ':!*.pdf' ':!*.zip' ':!*.mp4' ':!*.mov' ':!*.woff2' ':!*.ttf' ':!*.svg' 2>/dev/null | grep -v '^/dev/null'; then
            echo "❌ Possible secret found! Commit blocked."
            exit 1
          else
            echo "✅ No secrets detected."
          fi